# ==========================================================
# Chiaway Agro - Asistente Fitosanitario IA
# Configuracion base (Semana 4 - sin credenciales reales)
# ==========================================================

spring.application.name=chiaway-agro-diagnostico

# --- Base de datos (MySQL) ---
# Completar con las credenciales del entorno local antes de ejecutar.
spring.datasource.url=jdbc:mysql://localhost:3306/chiaway_agro?useSSL=false&serverTimezone=America/Lima
spring.datasource.username=CAMBIAR_USUARIO
spring.datasource.password=CAMBIAR_CONTRASENA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Servicios externos (se completaran en la fase de implementacion) ---
plantnet.api.key=CAMBIAR_API_KEY
openmeteo.api.baseUrl=https://api.open-meteo.com/v1
agente.llm.modelo=gpt-4o-mini

# --- Regla de negocio: umbral minimo de confianza para diagnostico automatico ---
diagnostico.confianza.umbral=0.70

server.port=8080
